[package]
name = "bubbles"
version = "0.2.1"
edition = "2024"
license = "MIT"
readme = "README.md"
keywords = ["sequencing", "bioinformatics"]
authors = ["Eilidh Ward"]
categories = ["science", "filesystem"]
description = "A terribly named, memory efficient, fast BAM file parser"
repository = "https://github.com/aylz83/bubbles"

[dependencies]
# async-trait = "0.1.92"
# byteorder = "1.5.0"
futures = "0.3.34"
rustc-hash = "2.1.3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
pufferfish = { git = "https://github.com/aylz83/pufferfish-rs", branch = "write_support", features = ["bgzf-async", "bgzf-stream", "bgzf-write"] }
bitflags = "2.13.2"
hashbrown = "0.17.1"
bstr = "1.13.1"
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
rayon = "1.12.0"
memchr = "2.8.3"
